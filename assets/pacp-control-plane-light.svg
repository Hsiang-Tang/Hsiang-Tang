<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 470" width="1150" height="470" role="img" aria-label="How PACP keeps AI agents on goal"><title>How PACP keeps AI agents on goal</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#147d78"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs><rect width="1150" height="470" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start">How PACP keeps AI agents on goal</text><text x="28" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">Agents are replaceable; the goal, the evidence, and the stop rules are not.</text><rect x="28" y="150" width="150" height="76" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="103" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Owner intent</text><text x="103" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">ambiguous request</text><path d="M178,188 L222,188" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#g)"/><rect x="224" y="104" width="232" height="168" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="340" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Goal Ladder</text><rect x="244" y="148" width="192" height="28" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="340" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">G1  accepted</text><rect x="244" y="186" width="192" height="28" rx="10" fill="#e7f3f1" stroke="#147d78" stroke-width="1.5"/><text x="340" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">G2  running</text><rect x="244" y="224" width="192" height="28" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 4"/><text x="340" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">G3  locked</text><text x="340" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">next goal unlocks only after</text><text x="340" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">independent verification</text><path d="M456,188 L500,188" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#g)"/><rect x="502" y="132" width="200" height="112" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="602" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Agent session</text><text x="602" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">Codex · Claude Code</text><text x="602" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">Brain plans and reviews</text><text x="602" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">Executor changes and tests</text><path d="M702,188 L746,188" fill="none" stroke="#147d78" stroke-width="1.6" marker-end="url(#a)"/><rect x="748" y="136" width="170" height="104" rx="10" fill="#e7f3f1" stroke="#147d78" stroke-width="1.5"/><text x="833" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Convergence gate</text><text x="833" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">counts accepted items,</text><text x="833" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">not commits or test runs</text><path d="M918,188 C940,188 940,116 962,116" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#g)"/><rect x="964" y="96" width="160" height="40" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="1044" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">COMPLETE</text><text x="1044" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">all acceptance met</text><path d="M918,188 C940,188 940,166 962,166" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#g)"/><rect x="964" y="146" width="160" height="40" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="1044" y="163" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">CONTINUE</text><text x="1044" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">verified progress</text><path d="M918,188 C940,188 940,216 962,216" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#g)"/><rect x="964" y="196" width="160" height="40" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="1044" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">REALIGN</text><text x="1044" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">drift from the goal</text><path d="M918,188 C940,188 940,266 962,266" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#g)"/><rect x="964" y="246" width="160" height="40" rx="10" fill="#e7f3f1" stroke="#147d78" stroke-width="1.5"/><text x="1044" y="263" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">CIRCUIT_BREAK</text><text x="1044" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">stalled or looping</text><rect x="502" y="330" width="416" height="108" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="710" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Task Footer</text><text x="710" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">one validated state, rendered as agent handoff and owner status</text><text x="710" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">enforced by Claude Code hooks, not prompt instructions</text><text x="710" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">fresh session rebuilt from Issue + Git checkpoint when context runs out</text><path d="M833,240 L833,328" fill="none" stroke="#147d78" stroke-width="1.6" marker-end="url(#a)"/><path d="M560,330 L560,246" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#g)"/><text x="620" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">session continuation</text></svg>